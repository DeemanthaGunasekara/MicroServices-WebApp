# Global Helm Values for Microservices Application

# Configuration for user-service
userService:
  replicaCount: 2
  image:
    repository: ghcr.io/deemanthagunasekara/user-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  probes:
    path: /healthz
    port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10

# Configuration for product-service
productService:
  replicaCount: 2
  image:
    repository: ghcr.io/deemanthagunasekara/product-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3001
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  probes:
    path: /healthz
    port: 3001
    initialDelaySeconds: 5
    periodSeconds: 10

# Configuration for web frontend
frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/deemanthagunasekara/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    limits:
      cpu: 200m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi
  probes:
    path: /
    port: 80
    initialDelaySeconds: 3
    periodSeconds: 10

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: localhost